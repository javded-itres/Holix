<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holix Studio</title>
  <link rel="stylesheet" href="/studio/assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Holix Studio</span>
    <span id="profile-label" class="muted"></span>
    <span id="conn-status" class="status">connecting…</span>
  </header>
  <main class="layout">
    <aside class="panel files-panel">
      <div class="panel-title">
        <span>Workspace</span>
        <div class="panel-actions">
          <button type="button" id="new-file-btn" class="btn small" title="New file">+ File</button>
          <button type="button" id="upload-btn" class="btn small" title="Upload">Upload</button>
        </div>
      </div>
      <div id="selected-dir" class="selected-dir muted">/</div>
      <div id="file-tree" class="file-tree"></div>
      <input type="file" id="file-upload" class="hidden" multiple />
    </aside>
    <section class="panel editor-panel">
      <div class="panel-title">
        <span id="editor-title">Editor</span>
        <div class="panel-actions">
          <button type="button" id="save-btn" class="btn small primary hidden" disabled>Save</button>
          <button id="diff-toggle" class="btn small hidden" type="button">Show diff</button>
        </div>
      </div>
      <div id="editor" class="editor-host"></div>
      <div id="diff-editor" class="editor-host hidden"></div>
    </section>
    <section class="panel chat-panel">
      <div class="panel-title">Agent</div>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form" action="#" method="post">
        <textarea id="chat-input" rows="3" placeholder="Message Holix… (/stop to cancel)"></textarea>
        <div class="chat-actions">
          <button type="submit" class="btn primary">Send</button>
          <button type="button" id="stop-btn" class="btn">Stop</button>
        </div>
      </form>
    </section>
  </main>
  <dialog id="new-file-dialog" class="studio-dialog">
    <form id="new-file-form">
      <h3 class="dialog-title">Новый файл</h3>
      <p id="new-file-dir-label" class="dialog-hint muted"></p>
      <label class="dialog-label" for="new-file-name">Имя файла</label>
      <input
        id="new-file-name"
        class="dialog-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="example.txt"
        required
      />
      <div class="dialog-actions">
        <button type="button" id="new-file-cancel" class="btn">Отмена</button>
        <button type="submit" class="btn primary">Создать</button>
      </div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/studio/assets/app.js?v=5" type="module"></script>
</body>
</html>
