[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holix-extension-demo"
version = "0.1.0"
description = "Reference Holix extension — one tool and one slash command via holix-sdk"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Pavel Lukyanov" }]
dependencies = [
    "Holix>=0.1.21",
    "holix-sdk>=0.1.0",
]

[project.entry-points."holix.agent.extensions"]
demo = "holix_extension_demo.agent:get_agent_extension"

[tool.hatch.build.targets.wheel]
packages = ["holix_extension_demo"]


[tool.uv.sources]
Holix = { workspace = true }